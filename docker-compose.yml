services:
  mariadb:
    image: mariadb:11
    container_name: syphon-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: syphon_root_pass
      MARIADB_DATABASE: syphon
      MARIADB_USER: syphon
      MARIADB_PASSWORD: syphon_pass
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=30
      --key-buffer-size=16M
      --table-open-cache=200
      --tmp-table-size=16M
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syphon-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: syphon-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: syphon_meili_key
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  trainer:
    build: ./training
    container_name: syphon-trainer
    restart: unless-stopped
    environment:
      MYSQL_HOST: mariadb
      MYSQL_PORT: "3306"
      MYSQL_USER: syphon
      MYSQL_PASSWORD: syphon_pass
      MYSQL_DATABASE: syphon
      MODEL_DIR: /app/checkpoints
    ports:
      - "8000:8000"
    volumes:
      - training_checkpoints:/app/checkpoints
      - training_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  redis_data:
  meili_data:
  training_checkpoints:
  training_data:
