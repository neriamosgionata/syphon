services:
  redis:
    image: redis:8-alpine
    container_name: syphon-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 96M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: syphon-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: syphon_meili_key
      MEILI_MAX_INDEXING_MEMORY: 384M
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  trainer:
    build: ./training
    container_name: syphon-trainer
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/checkpoints
    ports:
      - "8000:8000"
    volumes:
      - training_checkpoints:/app/checkpoints
      - training_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis_data:
  meili_data:
  training_checkpoints:
  training_data:
